[package]
name = "vite-plus-kumo"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust plugin for Vite and Vite-Plus enforcing Kumo UI design system standards."
license = "MIT"
repository = "https://github.com/cloudflare/vite-plus-kumo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.11", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"

[build-dependencies]
napi-build = "2.1.3"
